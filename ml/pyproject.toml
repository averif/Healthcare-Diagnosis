[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "medml"
version = "1.0.0"
description = "MediAssist ML: preprocessing, Decision Tree training, evaluation and explanations"
requires-python = ">=3.12"
dependencies = ["scikit-learn>=1.7", "pandas>=2.2", "numpy>=2.1", "joblib>=1.4"]

[project.optional-dependencies]
train = ["matplotlib>=3.9", "seaborn>=0.13"]

[project.scripts]
medml-train = "medml.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
